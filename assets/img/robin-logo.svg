<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Robin Nakamoto: a Shiba Inu wearing a green Robin Hood hat and black glasses">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B356"/><stop offset=".55" stop-color="#EBA33C"/><stop offset="1" stop-color="#DE9026"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF1DC"/><stop offset="1" stop-color="#F6DFBB"/>
    </linearGradient>
    <linearGradient id="hat" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#43B053"/><stop offset=".55" stop-color="#2E9440"/><stop offset="1" stop-color="#1F7530"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37A247"/><stop offset="1" stop-color="#1B6A2A"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="46"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#A8DC2B"/>

    <g stroke="#2B2116" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- ears (behind head) -->
      <path d="M168 232 L150 118 L246 176 Z" fill="url(#fur)"/>
      <path d="M352 232 L372 118 L276 176 Z" fill="url(#fur)"/>

      <!-- head -->
      <path d="M256 138c86 0 150 62 155 154 5 96-58 172-155 174-97-2-160-78-155-174 5-92 69-154 155-154Z" fill="url(#fur)"/>

      <!-- cheek / chest cream -->
      <path d="M256 268c58 0 104 40 110 96 4 40-14 76-46 92-58-8-90-8-128 0-32-16-50-52-46-92 6-56 52-96 110-96Z" fill="url(#cream)" stroke="none"/>
      <!-- muzzle -->
      <path d="M232 292c40 0 72 26 76 62 3 30-18 54-52 58-38 4-70-16-74-46-4-36 20-74 50-74Z" fill="url(#cream)" stroke="none"/>

      <!-- brow fur tufts -->
      <path d="M150 300c14-10 30-14 46-10" fill="none" stroke-width="6" opacity=".45"/>
      <path d="M366 300c-14-10-30-14-46-10" fill="none" stroke-width="6" opacity=".45"/>

      <!-- nose -->
      <path d="M214 330c16 0 29 9 29 20 0 12-13 21-29 21s-29-9-29-21c0-11 13-20 29-20Z" fill="#1E1A14" stroke="none"/>
      <!-- mouth: the doge smirk -->
      <path d="M214 371v16c0 14-12 24-27 24-13 0-24-8-27-19" fill="none" stroke="#1E1A14" stroke-width="8"/>
      <path d="M214 387c4 12 16 20 31 20 12 0 22-4 29-11" fill="none" stroke="#1E1A14" stroke-width="8"/>

      <!-- whisker dots -->
      <g fill="#1E1A14" stroke="none" opacity=".62">
        <circle cx="272" cy="352" r="4"/><circle cx="288" cy="364" r="4"/><circle cx="270" cy="374" r="4"/>
      </g>

      <!-- eyes -->
      <g stroke="none">
        <ellipse cx="196" cy="272" rx="21" ry="23" fill="#241C10"/>
        <ellipse cx="330" cy="272" rx="21" ry="23" fill="#241C10"/>
        <circle cx="204" cy="263" r="7" fill="#fff"/>
        <circle cx="338" cy="263" r="7" fill="#fff"/>
        <circle cx="191" cy="281" r="3.5" fill="#fff" opacity=".85"/>
        <circle cx="325" cy="281" r="3.5" fill="#fff" opacity=".85"/>
      </g>

      <!-- glasses -->
      <g fill="none" stroke="#15120D" stroke-width="13" stroke-linejoin="round">
        <rect x="152" y="238" width="94" height="72" rx="22"/>
        <rect x="286" y="238" width="94" height="72" rx="22"/>
        <path d="M246 268h40"/>
        <path d="M152 258c-12-3-22-2-30 3"/>
        <path d="M380 258c12-3 22-2 30 3"/>
      </g>
      <g fill="#fff" opacity=".22" stroke="none">
        <path d="M166 250h26l-24 48h-8a14 14 0 0 1-8-12v-24a14 14 0 0 1 14-12Z"/>
        <path d="M300 250h26l-24 48h-8a14 14 0 0 1-8-12v-24a14 14 0 0 1 14-12Z"/>
      </g>

      <!-- Robin Hood hat -->
      <path d="M118 214c-6-16 4-30 20-40 44-28 96-46 148-46 44 0 82 12 108 34 14 12 18 26 10 38-10 14-34 18-70 16-64-4-128 0-176 10-22 4-34 2-40-12Z" fill="url(#hat)"/>
      <path d="M110 208c46-14 118-22 190-20 44 1 82 6 108 14 12 4 14 14 4 20-12 8-40 12-84 12-84-1-156 3-196 10-18 3-30-2-32-14-1-9 4-18 10-22Z" fill="url(#brim)"/>
      <!-- hat sheen -->
      <path d="M150 178c34-18 78-30 122-32" fill="none" stroke="#8FE39C" stroke-width="9" opacity=".5" stroke-linecap="round"/>

      <!-- feather -->
      <path d="M352 128c26-34 62-56 96-62-8 36-24 68-46 90-16 16-34 22-48 18-8-12-8-30-2-46Z" fill="#FBFCF7"/>
      <path d="M448 66c-30 22-62 54-88 92" fill="none" stroke="#C9CFC2" stroke-width="6"/>
      <g fill="none" stroke="#C9CFC2" stroke-width="4" opacity=".85">
        <path d="M372 148c8-14 18-28 30-42"/><path d="M392 158c10-16 22-32 36-48"/><path d="M356 132c6-12 14-24 24-36"/>
      </g>
    </g>
  </g>
</svg>
